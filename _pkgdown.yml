template:
  bootstrap: 5
  bootswatch: cerulean
  bslib:
    bg: '#ffffff'
    fg: '#000000'
    primary: '#007aff'
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
# Die Ergebnis-Seiten (Brute-Force-Linkhub, Monotonie-Analyse, Vergleich
# Optimierer vs. Brute-Force) sind kein Teil der pkgdown-Site: Sie werden
# vollstaendig auf raindrop.kompetenz-wasser.io gepflegt und deployt und
# hier nur extern verlinkt.
navbar:
  structure:
    left: [intro, reference, articles, results, tutorials, news]
  components:
    results:
      text: More results
      menu:
      - text: Brute force
        href: https://raindrop.kompetenz-wasser.io/brute-force/
      - text: Monotonicity analysis
        href: https://raindrop.kompetenz-wasser.io/optimisation/monotonicity_analysis/
      - text: Optimiser vs. brute force
        href: https://raindrop.kompetenz-wasser.io/optimisation/optimiser_vs_brute-force/
development:
  mode: auto

